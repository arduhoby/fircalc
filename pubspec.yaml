name: mfcalc
description: Modular offline-first calculator with tape and finance tools.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  intl: ^0.20.2
  decimal: ^3.2.4
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: ^2.9.3
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  pdf: ^3.11.3
  excel: ^4.0.6
  share_plus: ^12.0.1
  http: ^1.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/fircalc_logo.png
    - assets/branding/app_logo_tree.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/fircalc_logo.png
  remove_alpha_ios: true
